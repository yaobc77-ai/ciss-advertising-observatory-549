[project]
name = "ciss-observatory"
version = "0.4.3"
description = "Evidence-linked fossil fuel advertising observatory"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dash>=3,<5",
    "dash-ag-grid>=32,<35",
    "dash-cytoscape>=1.0.2,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.26,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.5,<1",
    "pydantic>=2.11,<3",
    "openai>=2,<3",
    "tiktoken>=0.11,<1",
    "python-dotenv>=1,<2",
    "waitress>=3,<4",
    "pysbd>=0.3.4,<0.4",
    "lingua-language-detector==2.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12"]
pdf = ["pypdf==6.10.0"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
observatory = "observatory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running project PostgreSQL database", "live: makes paid API calls"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
