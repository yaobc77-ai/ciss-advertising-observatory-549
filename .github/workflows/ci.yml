name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: uv sync --frozen --extra test --extra mcp
      - name: Prepare tokenizer data for offline checks
        run: |
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/observatory-tiktoken" >> "$GITHUB_ENV"
          TIKTOKEN_CACHE_DIR="$RUNNER_TEMP/observatory-tiktoken" uv run --no-sync python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run complete development-collectable offline gate
        run: uv run --no-sync python scripts/run_project_checks.py --report-dir .runtime/project_checks_ci
      - name: Preserve offline gate scope, logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-development-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/project_checks_ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Build and install the release wheel
        run: |
          uv build --wheel --out-dir dist
          uv pip install --no-deps --force-reinstall dist/*.whl
      - name: Verify installed wheel resources and CLI separately
        env:
          OBS_RELEASE_WHEEL: "dist/*.whl"
          PYTHON_DOTENV_DISABLED: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --no-sync python -m pytest tests/test_release_configuration.py -q --junitxml=.runtime/release-wheel-ci/junit.xml
      - name: Preserve release wheel check JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/release-wheel-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
